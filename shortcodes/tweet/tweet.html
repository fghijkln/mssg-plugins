{#- Twitter/X 推文嵌入（Hugo {{< tweet >}} 兼容）
    用法：{{< tweet 推文ID >}}
-#}
{%- set tid = kwargs.get("id") or (args[0] if args else "") -%}
{%- if tid -%}
<blockquote class="twitter-tweet"><a href="https://twitter.com/x/status/{{ tid }}"></a></blockquote>
<script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
{%- endif -%}
