{#- Instagram 帖子嵌入（Hugo {{< instagram >}} 兼容）
    用法：{{< instagram 帖子ID >}}（URL 中 /p/ 后面的那串）
-#}
{%- set iid = kwargs.get("id") or (args[0] if args else "") -%}
{%- if iid -%}
<blockquote class="instagram-media" data-instgrm-permalink="https://www.instagram.com/p/{{ iid }}/"></blockquote>
<script async src="https://www.instagram.com/embed.js"></script>
{%- endif -%}
